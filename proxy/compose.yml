services:
  cloudflared:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --protocol http2 --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    networks:
      - proxynetwork

  # Optional: Tailscale Funnel — enable the `tailscale` profile to publicly expose ONE service
  # (e.g. Jellyfin) without port forwarding or putting heavy traffic through Cloudflare.
  # Docs: https://tailscale.com/kb/1223/funnel and https://tailscale.com/kb/1282/docker
  tailscale-funnel:
    profiles:
      - tailscale
    container_name: tailscale-funnel
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-jellyfin}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-jellyfin}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_AUTH_ONCE=true
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---accept-dns=false}
    volumes:
      - ./data/tailscale-funnel:/var/lib/tailscale
      # Bind mount the DIRECTORY (not the file) so Tailscale picks up serve config edits live.
      - ./config/tailscale-funnel:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - proxynetwork

  # Docker-routed backends get a route via `traefik.*` labels on their own container, in their
  # own stack's compose file (Traefik's Docker provider, exposedByDefault=false — nothing is
  # routed unless explicitly labeled). Backends with no compose stack in this repo (a NAS, a
  # router, another host on the LAN) get a static entry in ./config/traefik/dynamic/ instead.
  traefik:
    container_name: traefik
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Generous timeouts on websecure — NPM's advanced_config gave Jellyfin 1h read/send
      # timeouts for long transcode/stream sessions; Traefik's equivalent is per-entrypoint.
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=1h
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=1h
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=1h
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Dashboard: internal-only entrypoint, bound to loopback — never routed through
      # Cloudflare Tunnel or Tailscale Funnel. Reach it via `ssh -L 8080:localhost:8080`.
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.traefik.address=:8080
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik/letsencrypt:/letsencrypt
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      - traefik.http.routers.traefik-dashboard.entrypoints=traefik
      - traefik.http.routers.traefik-dashboard.service=api@internal
    networks:
      - proxynetwork
      - servarrnetwork
      - analyticsnetwork
      - monitoringnetwork
      - documentsnetwork
      - terminalnetwork
      - homepagenetwork
      - managementnetwork
      - adguardnetwork
      - notificationsnetwork

networks:
  proxynetwork:
    name: proxynetwork
  servarrnetwork:
    external: true
  analyticsnetwork:
    external: true
  monitoringnetwork:
    external: true
  documentsnetwork:
    external: true
  terminalnetwork:
    external: true
  homepagenetwork:
    external: true
  managementnetwork:
    external: true
  adguardnetwork:
    external: true
  notificationsnetwork:
    external: true
