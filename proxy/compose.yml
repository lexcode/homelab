services:
  cloudflared:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:2026.7.1@sha256:188bb03589a32affed3cf4d0590565ffe67b78866e6b5582574afab2b705bafe
    command: tunnel --no-autoupdate run --protocol http2 --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    networks:
      - proxynetwork

  # Optional: Tailscale Funnel — enable the `tailscale` profile to publicly expose ONE service
  # (e.g. Jellyfin) without port forwarding or putting heavy traffic through Cloudflare.
  # Docs: https://tailscale.com/kb/1223/funnel and https://tailscale.com/kb/1282/docker
  tailscale-funnel:
    profiles:
      - tailscale
    container_name: tailscale-funnel
    image: tailscale/tailscale:v1.98.8@sha256:d54b2e6a9c09f0e5ec52e82b9ad4af3d446b54a7c08075e92f11c39dd410105f
    hostname: ${TS_HOSTNAME:-jellyfin}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-jellyfin}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_AUTH_ONCE=true
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---accept-dns=false}
    volumes:
      - ./data/tailscale-funnel:/var/lib/tailscale
      # Bind mount the DIRECTORY (not the file) so Tailscale picks up serve config edits live.
      - ./config/tailscale-funnel:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - proxynetwork

  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:2.15.1@sha256:52b2c59994f3d36acfcf70a1626f29734df0ed8c71bacc0269f78b6f939858bb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${NPM_ADMIN_BIND_ADDRESS:-127.0.0.1}:81:81"
    volumes:
      - ./data/nginx-proxy-manager/data:/data
      - ./data/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - proxynetwork
      - servarrnetwork
      - analyticsnetwork
      - monitoringnetwork
      - documentsnetwork
      - terminalnetwork
      - homepagenetwork
      - managementnetwork

networks:
  proxynetwork:
    name: proxynetwork
  servarrnetwork:
    external: true
  analyticsnetwork:
    external: true
  monitoringnetwork:
    external: true
  documentsnetwork:
    external: true
  terminalnetwork:
    external: true
  homepagenetwork:
    external: true
  managementnetwork:
    external: true
