services:
  cloudflared:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --protocol http2 --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    networks:
      - proxynetwork

  # Optional: Tailscale Funnel — enable the `tailscale` profile to publicly expose ONE service
  # (e.g. Jellyfin) without port forwarding or putting heavy traffic through Cloudflare.
  # Docs: https://tailscale.com/kb/1223/funnel and https://tailscale.com/kb/1282/docker
  tailscale-funnel:
    profiles:
      - tailscale
    container_name: tailscale-funnel
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-jellyfin}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-jellyfin}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_AUTH_ONCE=true
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---accept-dns=false}
    volumes:
      - ./data/tailscale-funnel:/var/lib/tailscale
      # Bind mount the DIRECTORY (not the file) so Tailscale picks up serve config edits live.
      - ./config/tailscale-funnel:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - proxynetwork

  # Docker-routed backends get a route via `traefik.*` labels on their own container, in their
  # own stack's compose file (Traefik's Docker provider, exposedByDefault=false — nothing is
  # routed unless explicitly labeled). Backends with no compose stack in this repo (a NAS, a
  # router, another host on the LAN) get a static entry in ./config/traefik/dynamic/ instead.
  traefik:
    container_name: traefik
    # v3.3's bundled Docker client defaulted to an old API version (1.24) instead of negotiating
    # up to what the daemon actually supports; recent Docker Engine releases reject anything
    # below their stated minimum (seen: daemon reports API 1.55, refuses below 1.40), so the
    # Docker provider failed outright on v3.3. Confirmed fixed on v3.7.10 — DOCKER_API_VERSION
    # does NOT fix it (Traefik's Docker client doesn't read that env var).
    image: traefik:v3.7.10
    restart: unless-stopped
    # DNS-01, not HTTP-01: most *.lexcode.dev subdomains are DNS-only records pointing straight
    # at private LAN IPs (not proxied through Cloudflare), so they're not publicly routable and
    # HTTP-01 can never validate them — confirmed via a direct DNS-over-HTTPS query bypassing
    # local/LAN DNS. NPM's actual working setup used exactly this: one *.lexcode.dev wildcard
    # cert via DNS-01, reused for every host regardless of public reachability (see ADR-0001).
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Internal-only entrypoint for Tailscale Funnel traffic. Tailscale terminates TLS at its
      # own edge and forwards already-decrypted HTTP to this port over `proxynetwork` — it must
      # NOT go through the web(80) entrypoint's redirect-to-https, or it loops. Not published to
      # the host (proxynetwork-only), so it doesn't collide with any host-published port.
      - --entrypoints.tailscale.address=:8082
      # Generous timeouts on websecure — NPM's advanced_config gave Jellyfin 1h read/send
      # timeouts for long transcode/stream sessions; Traefik's equivalent is per-entrypoint.
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=1h
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=1h
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=1h
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Dashboard: internal-only entrypoint, bound to loopback — never routed through
      # Cloudflare Tunnel or Tailscale Funnel. Reach it via `ssh -L 8091:localhost:8091`.
      # Port 8080 is already claimed by qbittorrent's WEBUI_PORT (published on 0.0.0.0,
      # which covers loopback too) — 8091 avoids that collision.
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.traefik.address=:8091
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8091:8091"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik/letsencrypt:/letsencrypt
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      - traefik.http.routers.traefik-dashboard.entrypoints=traefik
      - traefik.http.routers.traefik-dashboard.service=api@internal
    networks:
      - proxynetwork
      - servarrnetwork
      - analyticsnetwork
      - monitoringnetwork
      - documentsnetwork
      - terminalnetwork
      - homepagenetwork
      - managementnetwork
      - adguardnetwork
      - notificationsnetwork

networks:
  proxynetwork:
    name: proxynetwork
  servarrnetwork:
    external: true
  analyticsnetwork:
    external: true
  monitoringnetwork:
    external: true
  documentsnetwork:
    external: true
  terminalnetwork:
    external: true
  homepagenetwork:
    external: true
  managementnetwork:
    external: true
  adguardnetwork:
    external: true
  notificationsnetwork:
    external: true
