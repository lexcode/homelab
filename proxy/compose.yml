services:
  cloudflared:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --protocol http2 --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    networks:
      - proxynetwork

  # Optional: Tailscale Funnel — enable the `tailscale` profile to publicly expose ONE service
  # (e.g. Jellyfin) without port forwarding or putting heavy traffic through Cloudflare.
  # Docs: https://tailscale.com/kb/1223/funnel and https://tailscale.com/kb/1282/docker
  tailscale-funnel:
    profiles:
      - tailscale
    container_name: tailscale-funnel
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-jellyfin}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-jellyfin}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_AUTH_ONCE=true
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---accept-dns=false}
    volumes:
      - ./data/tailscale-funnel:/var/lib/tailscale
      # Bind mount the DIRECTORY (not the file) so Tailscale picks up serve config edits live.
      - ./config/tailscale-funnel:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - proxynetwork

  # Docker-routed backends get a route via `traefik.*` labels on their own container, in their
  # own stack's compose file (Traefik's Docker provider, exposedByDefault=false — nothing is
  # routed unless explicitly labeled). Backends with no compose stack in this repo (a NAS, a
  # router, another host on the LAN) get a static entry in ./config/traefik/dynamic/ instead.
  traefik:
    container_name: traefik
    # v3.3's bundled Docker client defaulted to an old API version (1.24) instead of negotiating
    # up to what the daemon actually supports; recent Docker Engine releases reject anything
    # below their stated minimum (seen: daemon reports API 1.55, refuses below 1.40), so the
    # Docker provider failed outright on v3.3. Confirmed fixed on v3.7.10 — DOCKER_API_VERSION
    # does NOT fix it (Traefik's Docker client doesn't read that env var).
    image: traefik:v3.7.10
    restart: unless-stopped
    # Docker's embedded DNS (127.0.0.11) forwards to the host resolver and returns SERVFAIL / stale
    # negative-cache results for some public names — the same known issue documented in
    # media/compose.yml. It broke DNS-01's propagation check (lego polls via the container's own
    # resolver to confirm the _acme-challenge TXT record is visible before telling Let's Encrypt to
    # validate). Same fix: bypass it with explicit public resolvers.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # DNS-01, not HTTP-01: most *.lexcode.dev subdomains are DNS-only records pointing straight
    # at private LAN IPs (not proxied through Cloudflare), so they're not publicly routable and
    # HTTP-01 can never validate them — confirmed via a direct DNS-over-HTTPS query bypassing
    # local/LAN DNS. NPM's actual working setup used exactly this: one *.lexcode.dev wildcard
    # cert via DNS-01, reused for every host regardless of public reachability (see ADR-0001).
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Cloudflare Tunnel terminates public TLS itself. This Docker-private HTTP entrypoint lets
      # it reach selected backends without looping through web's HTTP-to-HTTPS redirect or
      # validating Traefik's internal default certificate. It is not published on the host.
      - --entrypoints.cloudflare.address=:8081
      # Internal-only entrypoint for Tailscale Funnel traffic. Tailscale terminates TLS at its
      # own edge and forwards already-decrypted HTTP to this port over `proxynetwork` — it must
      # NOT go through the web(80) entrypoint's redirect-to-https, or it loops. Not published to
      # the host (proxynetwork-only), so it doesn't collide with any host-published port.
      - --entrypoints.tailscale.address=:8082
      # Generous timeouts on websecure — NPM's advanced_config gave Jellyfin 1h read/send
      # timeouts for long transcode/stream sessions; Traefik's equivalent is per-entrypoint.
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=1h
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=1h
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=1h
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      # Skip lego's own pre-validation propagation check and just wait a fixed delay before
      # asking Let's Encrypt to validate directly. The client-side check (querying the container's
      # own resolver chain, then the zone's authoritative NS) proved unreliable in practice — a
      # transient SERVFAIL from Cloudflare's own authoritative server, on top of Docker's embedded
      # DNS being unreliable — even though the TXT record was genuinely live and correct the whole
      # time. Let's Encrypt does its own independent, authoritative check regardless, so this
      # local check was pure friction, not a real safety net.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.disablePropagationCheck=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delayBeforeCheck=30
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Dashboard: served on websecure at traefik.lexcode.dev like every other backend, behind
      # basicauth (the dashboard and its /api have no auth of their own). The loopback-only
      # `traefik` entrypoint below is kept as an unauthenticated break-glass path for when the
      # cert or the auth middleware is what's broken — reach it via `ssh -L 8091:localhost:8091`.
      # Port 8080 is already claimed by qbittorrent's WEBUI_PORT (published on 0.0.0.0 by the
      # `vpn` container, which covers loopback too) — 8091 avoids that collision.
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.traefik.address=:8091
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8091:8091"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik/letsencrypt:/letsencrypt
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
    labels:
      - traefik.enable=true
      # LAN-facing dashboard. *.lexcode.dev is a DNS-only wildcard pointing at this host, so this
      # name resolves on the LAN but is not publicly routable and is not in the Cloudflare Tunnel
      # ingress — same exposure as radarr/sonarr. basicauth is what stands between anyone on the
      # LAN and an unauthenticated admin API that maps every router, service and backend address.
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.lexcode.dev`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=traefik-auth
      # The hash's `$` must be written `$$` in .env — Compose interpolates .env values too, so an
      # un-escaped `$apr1$...` silently loses its salt and every login then fails.
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
      # Break-glass: loopback entrypoint, no auth, no TLS. Only reachable via SSH port-forward.
      - traefik.http.routers.traefik-dashboard-local.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      - traefik.http.routers.traefik-dashboard-local.entrypoints=traefik
      - traefik.http.routers.traefik-dashboard-local.service=api@internal
    networks:
      - proxynetwork
      - servarrnetwork
      - analyticsnetwork
      - monitoringnetwork
      - documentsnetwork
      - terminalnetwork
      - homepagenetwork
      - managementnetwork
      - adguardnetwork
      - notificationsnetwork
      - resonarrnetwork

networks:
  proxynetwork:
    name: proxynetwork
  servarrnetwork:
    external: true
  analyticsnetwork:
    external: true
  monitoringnetwork:
    external: true
  documentsnetwork:
    external: true
  terminalnetwork:
    external: true
  homepagenetwork:
    external: true
  managementnetwork:
    external: true
  adguardnetwork:
    external: true
  notificationsnetwork:
    external: true
  resonarrnetwork:
    # This is intentionally proxy-managed rather than external: the proxy must be able to start
    # on hosts where Resonarr has not yet been deployed. Resonarr consumes this named network as
    # external once the proxy has created it.
    name: resonarrnetwork
