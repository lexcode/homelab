services:
  cloudflared:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --protocol http2 --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - proxynetwork

  # Optional: Tailscale Funnel — publicly expose ONE service (e.g. Jellyfin) via Tailscale's edge
  # without port forwarding and without putting heavy traffic through Cloudflare. Leave commented
  # if you do not need it; the rest of the stack keeps working without this container.
  # Docs: https://tailscale.com/kb/1223/funnel and https://tailscale.com/kb/1282/docker
  tailscale-funnel:
    container_name: tailscale-funnel
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-jellyfin}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-jellyfin}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_AUTH_ONCE=true
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---accept-dns=false}
    volumes:
      - ./data/tailscale-funnel:/var/lib/tailscale
      # Bind mount the DIRECTORY (not the file) so Tailscale picks up serve config edits live.
      - ./config/tailscale-funnel:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - proxynetwork

  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./data/nginx-proxy-manager/data:/data
      - ./data/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - proxynetwork
      - servarrnetwork
      - analyticsnetwork
      - monitoringnetwork
      - documentsnetwork
      - terminalnetwork
      - homepagenetwork
      - managementnetwork

networks:
  proxynetwork:
    name: proxynetwork
  servarrnetwork:
    external: true
  analyticsnetwork:
    external: true
  monitoringnetwork:
    external: true
  documentsnetwork:
    external: true
  terminalnetwork:
    external: true
  homepagenetwork:
    external: true
  managementnetwork:
    external: true
