# External-routed backends: devices/hosts with no Docker Compose stack in this repo, so they
# can't be discovered via Traefik's Docker provider. Docker-routed backends are labeled in
# their own stack's compose.yml instead — see proxy/README.md.
http:
  routers:
    # Reachable via Cloudflare Tunnel, has a real public DNS record — gets a real LE cert.
    jellyfin-cloudflare:
      rule: "Host(`jellyfin.lexcode.dev`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: jellyfin

    # Tailscale terminates TLS at its own edge and forwards already-decrypted HTTP to Traefik's
    # dedicated `tailscale` entrypoint (see proxy/compose.yml) — not `websecure`, which would
    # both loop through the web(80) redirect and fail ACME (`*.ts.net` has no public DNS Let's
    # Encrypt can validate against). No `tls:` block: this router serves plain HTTP internally.
    jellyfin-tailscale:
      rule: "Host(`jellyfin.taile28bc7.ts.net`)"
      entrypoints:
        - tailscale
      service: jellyfin

    # tracearr/unraid/router-ui/adguard2/synology are LAN-only — confirmed no public DNS record
    # (NXDOMAIN), so a public ACME resolver can never validate them; requesting one anyway just
    # burns Let's Encrypt's per-hostname failure rate limit. `tls: {}` still terminates TLS with
    # Traefik's own default self-signed cert (browsers will warn once, same as most self-hosted
    # LAN admin UIs) without ever calling out to Let's Encrypt.
    tracearr:
      rule: "Host(`tracearr.lexcode.dev`)"
      entrypoints:
        - websecure
      tls: {}
      service: tracearr

    unraid:
      rule: "Host(`unraid.lexcode.dev`)"
      entrypoints:
        - websecure
      tls: {}
      service: unraid

    router-ui:
      rule: "Host(`ui.lexcode.dev`)"
      entrypoints:
        - websecure
      tls: {}
      service: router-ui

    adguard2:
      rule: "Host(`adguard2.lexcode.dev`)"
      entrypoints:
        - websecure
      tls: {}
      service: adguard2

    synology:
      rule: "Host(`synology.lexcode.dev`)"
      entrypoints:
        - websecure
      tls: {}
      service: synology

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.0.149:8096"

    tracearr:
      loadBalancer:
        servers:
          - url: "http://192.168.0.149:3010"

    unraid:
      loadBalancer:
        servers:
          - url: "http://192.168.0.149:80"

    # Self-signed backend certs (router admin UI, NAS) — Traefik must skip verification
    # to reach them, same trust model NPM used by default.
    router-ui:
      loadBalancer:
        servers:
          - url: "https://192.168.0.1:443"
        serversTransport: insecure-backend

    adguard2:
      loadBalancer:
        servers:
          - url: "http://192.168.0.2:80"

    synology:
      loadBalancer:
        servers:
          - url: "https://192.168.0.10:5001"
        serversTransport: insecure-backend

  serversTransports:
    insecure-backend:
      insecureSkipVerify: true
