networks:
  analyticsnetwork:
    name: analyticsnetwork
    ipam:
      config:
        - subnet: ${ANALYTICS_SUBNET:-172.39.2.0/24}

services:
  your_spotify_server:
    image: yooooomi/your_spotify_server:1.20.0@sha256:624ea009f2ef9d877989bee9c7913ac66840449f566517871696c31a8ea13ddf
    container_name: your_spotify_server
    restart: unless-stopped
    ports:
      - ${YOUR_SPOTIFY_API_PORT:-8080}:8080
    environment:
      - API_ENDPOINT=${YOUR_SPOTIFY_API_ENDPOINT}
      - CLIENT_ENDPOINT=${YOUR_SPOTIFY_CLIENT_ENDPOINT}
      - SPOTIFY_PUBLIC=${SPOTIFY_PUBLIC}
      - SPOTIFY_SECRET=${SPOTIFY_SECRET}
      - MONGO_ENDPOINT=mongodb://your_spotify_mongo:27017/your_spotify
      - TIMEZONE=${TZ}
      - LOG_LEVEL=${YOUR_SPOTIFY_LOG_LEVEL:-info}
      - COOKIE_VALIDITY_MS=8h
      - MAX_IMPORT_CACHE_SIZE=100000
    depends_on:
      your_spotify_mongo:
        condition: service_healthy
    networks:
      analyticsnetwork:
        ipv4_address: ${YOUR_SPOTIFY_SERVER_IP:-172.39.2.2}

  your_spotify_client:
    image: yooooomi/your_spotify_client:1.20.0@sha256:e4da90a0634c7862f9f4e893026ee8cd91380234fa2125b88b26c6fb9da3d47e
    container_name: your_spotify_client
    restart: unless-stopped
    ports:
      - ${YOUR_SPOTIFY_CLIENT_PORT:-3000}:3000
    environment:
      - API_ENDPOINT=${YOUR_SPOTIFY_API_ENDPOINT}
    depends_on:
      - your_spotify_server
    networks:
      analyticsnetwork:
        ipv4_address: ${YOUR_SPOTIFY_CLIENT_IP:-172.39.2.3}

  your_spotify_mongo:
    image: mongo:4.4@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef # ARM (Raspberry Pi) — use mongo:6 on x86_64
    container_name: your_spotify_mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if command -v mongosh >/dev/null 2>&1; then mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'; else mongo --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./data/mongo:/data/db
    networks:
      analyticsnetwork:
        ipv4_address: ${YOUR_SPOTIFY_MONGO_IP:-172.39.2.4}
