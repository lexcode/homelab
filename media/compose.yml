networks:
  servarrnetwork:
    name: servarrnetwork
    ipam:
      config:
        # If you change SERVARR_SUBNET in .env, update every ipv4_address below to match that range.
        - subnet: ${SERVARR_SUBNET:-172.39.0.0/24}

# Docker's embedded DNS often forwards to the host resolver and returns SERVFAIL for some names
# (e.g. api.radarr.video). Merge `<<: *arr-dns` on servarrnetwork services only — not with network_mode: service:vpn
# (those inherit dns from the vpn container).
x-arr-dns: &arr-dns
  dns:
    - 1.1.1.1
    - 8.8.8.8

services:
  # PIA WireGuard — ./pia and ./pia-shared on the host
  # Stays on servarrnetwork at ${VPN_IP} so other containers can reach qBittorrent at http://${VPN_IP}:${WEBUI_PORT}
  vpn:
    image: thrnz/docker-wireguard-pia:20260701_master_835e5bc@sha256:a65fcfd4597c7af6c52ef9dc781e2a7df0089a7f7ff0f41b6ba8f3f957068e03
    container_name: vpn
    dns:
      - 1.1.1.1
      - 8.8.8.8
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    labels:
      - deunhealth.restart.on.unhealthy=true
    ports:
      - ${WEBUI_PORT:-8080}:${WEBUI_PORT:-8080} # qBittorrent WebUI
      - ${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}
      - 9696:9696 # prowlarr
      - 8191:8191 # flaresolverr
      - ${TORRENTING_PORT:-41066}:${TORRENTING_PORT:-41066}/tcp
      - ${TORRENTING_PORT:-41066}:${TORRENTING_PORT:-41066}/udp
    networks:
      servarrnetwork:
        ipv4_address: ${VPN_IP:-172.39.0.2}
    volumes:
      - ./data/pia:/pia
      - ./data/pia-shared:/pia-shared
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    environment:
      - LOC=${PIA_LOC:-swiss}
      - USER=${OPENVPN_USER}
      - PASS=${OPENVPN_PASSWORD}
      - LOCAL_NETWORK=${LOCAL_NETWORK}
      - PORT_FORWARDING=1
      - PORT_PERSIST=1
      - MTU=1280 # Pi / VPN: avoids path-MTU black holes that show up as stalled torrents
      # - VPNDNS=${VPNDNS}
      - TZ=${TZ}
      - ACTIVE_HEALTHCHECKS=1 # image's built-in healthcheck otherwise only does passive checks
      - PORT_FATAL=1 # treat port-forwarding failures (the curl timeout loop) as fatal
      - EXIT_ON_FATAL=1 # exit on fatal error so `restart: unless-stopped` + deunhealth can recover it
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    restart: unless-stopped
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # vpn:
  #   image: qmcgaw/gluetun
  #   cap_add:
  #     - NET_ADMIN
  #   devices:
  #     - /dev/net/tun:/dev/net/tun
  #   networks:
  #     servarrnetwork:
  #       ipv4_address: ${VPN_IP:-172.39.0.2}
  #   ports:
  #     - ${WEBUI_PORT:-8080}:${WEBUI_PORT:-8080} # qBittorrent WebUI
  #     - ${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}
  #     - ${PROWLARR_PORT:-9696}:${PROWLARR_PORT:-9696} # prowlarr
  #     - ${FLARESOLVERR_PORT:-8191}:${FLARESOLVERR_PORT:-8191} # flaresolverr
  #   volumes:
  #     - ./gluetun:/gluetun
  #   env_file:
  #     - .env
  #   restart: unless-stopped

  # qBittorrent WebUI → Settings → Advanced: set "Network interface" to wg0 (WireGuard in vpn
  # container). Use IPv4 only if stalls persist (IPv6 disabled on vpn sysctls). Gluetun/OpenVPN
  # typically uses tun0 instead of wg0.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:version-5.2.3_v2.0.13@sha256:352371a7242e8b4aa10958ca02076d1023758070519b89a10251475fb9f1a35a
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${WEBUI_PORT:-8080}
      - TORRENTING_PORT=${TORRENTING_PORT}
    volumes:
      - ./data/qbittorrent:/config
      - /mnt/usb/downloads2:/data/downloads2
      - /mnt/usb2/downloads:/data/downloads3
      - /data/downloads-unraid:/data/downloads-unraid
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    network_mode: service:vpn
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s

  deunhealth:
    image: qmcgaw/deunhealth:v0.3.0@sha256:4102bf5d788fd0580ee5adb367cf48fc269a154b8fd284e6315e0dd8b24bb03c
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=${TZ}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  sonarr:
    <<: *arr-dns
    image: lscr.io/linuxserver/sonarr:version-4.0.19.2979@sha256:4b025354d338999e03bf6dbdadcdde94815d39d4a5aba5de3cdc86a56d7d6c51
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/sonarr:/config
      - /data:/data
      - /data/downloads-unraid:/data/downloads-unraid
      - /mnt/usb/downloads2:/data/downloads2
      - /mnt/usb2/downloads:/data/downloads3
    ports:
      - 8989:8989
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    networks:
      servarrnetwork:
        ipv4_address: ${SONARR_IP:-172.39.0.3}

  radarr:
    <<: *arr-dns
    image: lscr.io/linuxserver/radarr:version-6.2.1.10461@sha256:28852d0eacababc206762af48fe86d78594a4f434cc46b358f9764a857098662
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/radarr:/config
      - /data:/data
      - /mnt/usb/downloads2:/data/downloads2
      - /mnt/usb2/downloads:/data/downloads3
      - /data/downloads-unraid:/data/downloads-unraid
    ports:
      - 7878:7878
    networks:
      servarrnetwork:
        ipv4_address: ${RADARR_IP:-172.39.0.4}

  lidarr:
    <<: *arr-dns
    image: lscr.io/linuxserver/lidarr:version-3.1.0.4875@sha256:94a876d1581f2ae5af5b846320d5f6f7a102a4755939ce0b43b01c60f9f86056
    container_name: lidarr
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/lidarr:/config
      - /data:/data
      - /mnt/usb/downloads2:/data/downloads2
      - /mnt/usb2/downloads:/data/downloads3
      - /data/downloads-unraid:/data/downloads-unraid
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8686:8686
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    networks:
      servarrnetwork:
        ipv4_address: ${LIDARR_IP:-172.39.0.5}

  bazarr:
    <<: *arr-dns
    image: lscr.io/linuxserver/bazarr:version-v1.6.0@sha256:5d916d07404296ec35ee726e13e0e558f05952724cf494a7f009d913fb2b12f3
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/bazarr:/config
      - /data:/data
    ports:
      - 6767:6767
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    networks:
      servarrnetwork:
        ipv4_address: ${BAZARR_IP:-172.39.0.6}

  seerr:
    <<: *arr-dns
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:v3.3.0@sha256:c92d2dc117f62185e7bcb88cd56efd374ea79210eaf433275449e8d5988eb5a8
    environment:
      - LOG_LEVEL=${SEERR_LOG_LEVEL:-info}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./data/seerr:/app/config
    ports:
      - 5055:5055
    networks:
      servarrnetwork:
        ipv4_address: ${SEERR_IP:-172.39.0.7}

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:version-2.4.0.5397@sha256:536036aeb2c740d1a660ccf143b58a8bd6222f09010258fdfc10a538af7bec78
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/prowlarr:/config
    restart: unless-stopped
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    network_mode: service:vpn

  # Host network: outbound calls to Jellyfin/Plex use the host LAN IP (e.g. 192.168.0.5).
  # On a bridged custom network, TCP can leave with source 172.39.0.x; LAN-only firewalls
  # (common on Unraid) then block :8096 while ping still works — same symptom as your wget timeout.
  suggestarr:
    image: ciuse99/suggestarr:v2.9.1@sha256:cfa4fb77862f6cea57f164bf44204c958fb96842815d601e09c92c17dd75d173
    container_name: suggestarr
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/suggestarr/config_files:/app/config/config_files
    environment:
      - LOG_LEVEL=${SUGGESTARR_LOG_LEVEL:-info}
      - SUGGESTARR_PORT=${SUGGESTARR_PORT:-5000}

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
    restart: unless-stopped
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    network_mode: service:vpn
