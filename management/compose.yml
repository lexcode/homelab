services:
  dockge:
    image: louislam/dockge:1.5.0@sha256:335c6368b880ecc203236ed89e6e5232e0d6578e8ef5920e4a502390451502bf
    container_name: dockge
    restart: unless-stopped
    ports:
      - "${DOCKGE_BIND_ADDRESS:-127.0.0.1}:${DOCKGE_PORT:-5002}:5001"
    environment:
      - DOCKGE_STACKS_DIR=${HOMELAB_ROOT:?Set HOMELAB_ROOT in management/.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/dockge:/app/data
      # Dockge requires the stacks path to be identical on the host and in the container.
      - ${HOMELAB_ROOT:?Set HOMELAB_ROOT in management/.env}:${HOMELAB_ROOT:?Set HOMELAB_ROOT in management/.env}
    networks:
      - managementnetwork

networks:
  managementnetwork:
    name: managementnetwork
    ipam:
      config:
        - subnet: ${MANAGEMENT_SUBNET:-172.39.8.0/24}
