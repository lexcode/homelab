# n8n Assistant code-execution sandbox.
#
# This stack is NOT a second n8n instance. The n8n editor stays in `n8n/`; that stack
# owns `n8n-sandbox-network` and reaches `sandbox-api` by name.
#
# Docs: https://docs.n8n.io/deploy/host-n8n/configure-n8n/set-up-n8n-assistant/
#       -> "Setup 2: Self-host the sandbox manually (advanced)"
#
# Adapted from n8n's canonical stack, trimmed to the three services Setup 2 requires
# (sandbox-certs, sandbox-api, sandbox-runner-1) plus the optional SearXNG web search:
# https://github.com/n8n-io/n8n/blob/master/docker/get-n8n-compose.yml
#
# Deliberately omitted from the canonical file:
#   - `runners` (external Code-node task runner) — not required by n8n Assistant, and
#     costs another ~150 MB on a host that is already memory-tight.
#   - `n8n` itself — it lives in the `n8n/` stack.
#
# INTENTIONALLY NOT HARDENED: sandbox-runner-1 runs privileged Docker-in-Docker. That is
# how it isolates AI-generated code. Do not add cap_drop/no-new-privileges there, and never
# publish its ports or attach it to a network that faces the internet.

services:
  # One-shot job: generates the mutual-TLS material the API and runner use to talk to
  # each other, then exits. Certificates are issued for `sandbox-api` and
  # `sandbox-runner-<n>`, so those service names must not be renamed without
  # regenerating the certificates (delete data/tls and re-run this service).
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:?Set N8N_SANDBOX_VERSION in n8n-sandbox/.env}
    container_name: n8n-sandbox-certs
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - ./data/tls:/tls
    # Joins the stack network only so Compose does not create a stray `<project>_default`
    # network for this one-shot job. It makes no network calls.
    networks:
      - n8n-sandbox-network

  # Control plane. n8n talks to this over plain HTTP on the shared network; the mTLS
  # hop is between this container and the runner.
  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION:?Set N8N_SANDBOX_VERSION in n8n-sandbox/.env}
    container_name: n8n-sandbox-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SANDBOX_API_MEM_LIMIT:-512m}
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - ./data/tls:/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      # LAN-only, like every other route here: websecure + no `cloudflare` entrypoint
      # router. This exists so the API can be probed/tested from a LAN machine; it is
      # NOT what n8n uses. n8n keeps talking to http://sandbox-api:8080 over the Docker
      # network (N8N_SANDBOX_SERVICE_URL), so a Traefik outage cannot break the Assistant.
      #
      # The route is bearer-token authenticated (401 without a key), which is the only
      # thing between a LAN client and a code-execution control plane. Keep
      # N8N_SANDBOX_SERVICE_API_KEY / SANDBOX_API_KEYS long and random.
      - traefik.http.routers.n8n-sandbox-api.rule=Host(`${N8N_SANDBOX_API_HOSTNAME:?Set N8N_SANDBOX_API_HOSTNAME in n8n-sandbox/.env}`)
      - traefik.http.routers.n8n-sandbox-api.entrypoints=websecure
      - traefik.http.routers.n8n-sandbox-api.tls.certresolver=letsencrypt
      - traefik.http.routers.n8n-sandbox-api.priority=10
      - traefik.http.services.n8n-sandbox-api.loadbalancer.server.port=8080
    networks:
      - n8n-sandbox-network
    # No published host ports: the only inbound paths are Traefik (hostname above) and
    # n8n by service name over the Compose network.

  # The privileged Docker-in-Docker worker that actually creates and runs sandboxes.
  # On first use it pulls the `...-sandbox` image into its *inner* Docker daemon, which
  # is persisted to ./data/runner-docker so a container recreate does not re-download it.
  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION:?Set N8N_SANDBOX_VERSION in n8n-sandbox/.env}
    container_name: n8n-sandbox-runner-1
    restart: unless-stopped
    privileged: true
    mem_limit: ${SANDBOX_RUNNER_MEM_LIMIT:-1536m}
    depends_on:
      sandbox-api:
        condition: service_healthy
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION:?Set N8N_SANDBOX_VERSION in n8n-sandbox/.env}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - ./data/tls:/tls:ro
      # Inner Docker storage for the sandbox image. Grows over time; safe to wipe with
      # `docker compose down` + `sudo rm -rf data/runner-docker` to reclaim space.
      - ./data/runner-docker:/var/lib/docker
    networks:
      - n8n-sandbox-network
    # Never expose this container's ports publicly — it runs privileged Docker-in-Docker.

  # Optional web search backend for n8n Assistant. n8n reaches it at
  # http://searxng:8080 (N8N_INSTANCE_AI_SEARXNG_URL in n8n/.env). Brave Search takes
  # priority over this if INSTANCE_AI_BRAVE_SEARCH_API_KEY is set.
  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: n8n-sandbox-searxng
    restart: unless-stopped
    # no cap_drop here: the upstream image starts as root and drops to its own user
    # internally, so a full cap drop would need verification against a live container.
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SEARXNG_MEM_LIMIT:-256m}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in n8n-sandbox/.env}
      # Absolute base URL, because Traefik fronts this on a hostname. n8n itself still
      # calls http://searxng:8080 by service name over the Docker network.
      SEARXNG_BASE_URL: https://${N8N_SEARXNG_HOSTNAME:?Set N8N_SEARXNG_HOSTNAME in n8n-sandbox/.env}/
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    labels:
      - traefik.enable=true
      # LAN-only: websecure router with no `cloudflare` entrypoint router. Human-facing
      # search UI, and the same engine n8n Assistant calls for web search.
      - traefik.http.routers.n8n-searxng.rule=Host(`${N8N_SEARXNG_HOSTNAME:?Set N8N_SEARXNG_HOSTNAME in n8n-sandbox/.env}`)
      - traefik.http.routers.n8n-searxng.entrypoints=websecure
      - traefik.http.routers.n8n-searxng.tls.certresolver=letsencrypt
      - traefik.http.routers.n8n-searxng.priority=10
      - traefik.http.services.n8n-searxng.loadbalancer.server.port=8080
    networks:
      - n8n-sandbox-network
    # No published host ports: Traefik reaches it over n8n-sandbox-network, n8n by
    # service name. Never publish this container's port directly.

  # NOTE — sandbox-runner-1 deliberately has no Traefik labels and no hostname. It is a
  # privileged Docker-in-Docker worker; upstream is explicit: "Never publish 8080/9090 to
  # the host on an internet-facing server." Only sandbox-api and searxng are routed.

networks:
  # Owned and created by the `n8n/` stack, which is the always-on one — same arrangement
  # as `proxy/` owning `resonarrnetwork`. Start `n8n/` at least once before this stack.
  n8n-sandbox-network:
    external: true
    name: n8n-sandbox-network
