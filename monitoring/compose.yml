networks:
  monitoringnetwork:
    name: monitoringnetwork
    ipam:
      config:
        - subnet: ${MONITORING_SUBNET:-172.39.1.0/24}

services:
  beszel:
    image: henrygd/beszel:0.18.7@sha256:a849ad80814b6a1a3be665304dcace5d4854b3bed7bde4dd1227e8ce1b82d477
    container_name: beszel
    restart: unless-stopped
    environment:
      - APP_URL=${BESZEL_URL:-http://localhost:8090}
      - LOG_LEVEL=${BESZEL_LOG_LEVEL:-info}
    ports:
      - ${BESZEL_PORT:-8090}:${BESZEL_PORT:-8090}
    volumes:
      - ./data/beszel_data:/beszel_data
    networks:
      monitoringnetwork:
        ipv4_address: ${BESZEL_IP:-172.39.1.2}

  beszelagent:
    image: henrygd/beszel-agent:0.18.7@sha256:8874e2c53f9de5e063a6a80d6b617e20fa593ac5dc4eb4c6ce1f912f510f38f8
    container_name: beszelagent
    restart: unless-stopped
    network_mode: service:beszel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/beszel_agent_data:/var/lib/beszel-agent
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: ${BESZEL_AGENT_LISTEN:-45876}
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      HUB_URL: ${BESZEL_URL}

    # optional but helpful log viewer
  dozzle:
    image: amir20/dozzle:v10.6.9@sha256:6f4644814cce31e11fe80f2610515df6a5a2e40120b4087c298a72df8d65866b
    restart: unless-stopped
    container_name: dozzle
    environment:
      DOZZLE_REMOTE_AGENT: ${DOZZLE_REMOTE_AGENT}
      DOZZLE_HOSTNAME: ${DOZZLE_HOSTNAME:-mario}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/dozzle_data:/data
    ports:
      - "${DOZZLE_BIND_ADDRESS:-127.0.0.1}:8181:8080"
    networks:
      monitoringnetwork:
        ipv4_address: ${DOZZLE_IP:-172.39.1.3}

  dozzle-agent:
    image: amir20/dozzle:v10.6.9@sha256:6f4644814cce31e11fe80f2610515df6a5a2e40120b4087c298a72df8d65866b
    command: agent
    restart: unless-stopped
    container_name: dozzle-agent
    environment:
      DOZZLE_HOSTNAME: ${DOZZLE_HOSTNAME:-mario}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_AGENT_BIND_ADDRESS:?Set DOZZLE_AGENT_BIND_ADDRESS to this host's trusted LAN address}:7007:7007"
