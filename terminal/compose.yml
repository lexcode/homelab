services:
  atuin:
    container_name: atuin
    restart: always
    image: ghcr.io/atuinsh/atuin:c28ac1b@sha256:2aac9dea56a4ed9cd8b5869a4317c44d4b1d447c030ef16aa5ecb5c4886befe8
    command: server start
    volumes:
      - "./data/config:/config"
    ports:
      - 8888:8888
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_OPEN_REGISTRATION: "true"
      ATUIN_DB_URI: postgres://$ATUIN_DB_USERNAME:$ATUIN_DB_PASSWORD@db/$ATUIN_DB_NAME
      RUST_LOG: info,atuin_server=debug
    depends_on:
      db:
        condition: service_healthy
    networks:
      - terminalnetwork

  db:
    container_name: atuin_db
    image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - terminalnetwork
    volumes: # PG 18+: mount parent dir (cluster lives in .../18/docker). See postgres Docker README.
      - "./data/database:/var/lib/postgresql"
    environment:
      POSTGRES_USER: ${ATUIN_DB_USERNAME}
      POSTGRES_PASSWORD: ${ATUIN_DB_PASSWORD}
      POSTGRES_DB: ${ATUIN_DB_NAME}

  # Backup service for atuin database
  backup:
    container_name: atuin_db_dumper
    image: prodrigestivill/postgres-backup-local:18-debian-d257e5d@sha256:f70742ebe42b2277689b028d1fd15aa80f77cffa01da163cc9f85a6ff1866e7f
    restart: unless-stopped
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${ATUIN_DB_NAME}
      POSTGRES_USER: ${ATUIN_DB_USERNAME}
      POSTGRES_PASSWORD: ${ATUIN_DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_DIR: /db_dumps
    volumes:
      - ./data/db_dumps:/db_dumps
    depends_on:
      db:
        condition: service_healthy
    networks:
      - terminalnetwork

networks:
  terminalnetwork:
    name: terminalnetwork
