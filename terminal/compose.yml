services:
  atuin:
    container_name: atuin
    restart: always
    image: ghcr.io/atuinsh/atuin:18.18.1
    command: start
    volumes:
      - "./data/config:/config"
    ports:
      - 8888:8888
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_OPEN_REGISTRATION: "true"
      ATUIN_DB_URI: postgres://$ATUIN_DB_USERNAME:$ATUIN_DB_PASSWORD@db/$ATUIN_DB_NAME
      RUST_LOG: info,atuin_server=debug
    depends_on:
      db:
        condition: service_healthy
    networks:
      - terminalnetwork

  db:
    container_name: atuin_db
    image: postgres:18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - terminalnetwork
    volumes: # PG 18+: mount parent dir (cluster lives in .../18/docker). See postgres Docker README.
      - "./data/database:/var/lib/postgresql"
    environment:
      POSTGRES_USER: ${ATUIN_DB_USERNAME}
      POSTGRES_PASSWORD: ${ATUIN_DB_PASSWORD}
      POSTGRES_DB: ${ATUIN_DB_NAME}

  # Backup service for atuin database
  backup:
    container_name: atuin_db_dumper
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    env_file:
      - ${SERVICE_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${ATUIN_DB_NAME}
      POSTGRES_USER: ${ATUIN_DB_USERNAME}
      POSTGRES_PASSWORD: ${ATUIN_DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_DIR: /db_dumps
    volumes:
      - ./data/db_dumps:/db_dumps
    depends_on:
      db:
        condition: service_healthy
    networks:
      - terminalnetwork

networks:
  terminalnetwork:
    name: terminalnetwork
